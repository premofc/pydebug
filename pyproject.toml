[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydebug"
version = "0.1.0"
description = "Next-Gen 3D Visual Python Debugger combining Hunter execution speed with Birdseye AST expression introspection."
readme = "README.md"
authors = [{ name = "Antigravity Engineering" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi", "starlette", "uvicorn"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
pydebug = "pydebug.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pydebug*"]

[tool.setuptools.package-data]
pydebug = ["ui/*"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
