[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydebug-studio"
version = "0.1.7"
description = "Next-Gen visual Python debugger and live runtime tracer with Swagger-grade dashboard, Hunter VCR timeline, and Birdseye AST expression inspection."
readme = "README.md"
authors = [{ name = "Premnathan", email = "premnath.4518@gmail.com" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["debugger", "tracer", "hunter", "birdseye", "fastapi", "starlette", "mcp", "profiler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/premofc/pydebug"
Repository = "https://github.com/premofc/pydebug.git"
Issues = "https://github.com/premofc/pydebug/issues"

[project.optional-dependencies]
fastapi = ["fastapi", "starlette", "uvicorn"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
pydebug = "pydebug.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pydebug*"]

[tool.setuptools.package-data]
pydebug = ["ui/**/*", "ui/*"]
